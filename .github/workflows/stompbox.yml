name: Stomp Box APK

on:
  push:
    paths:
      - "stompbox/**"
      - ".github/workflows/stompbox.yml"
  pull_request:
    paths:
      - "stompbox/**"
      - ".github/workflows/stompbox.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stompbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: stompbox-apk
          path: stompbox/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
